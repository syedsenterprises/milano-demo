name: Replace index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new file
        run: |
          mv milano-ice-cream-hyderabad.html index.html
          rm -rf .github/workflows/rename.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update: speed, block layout, hamburger menu, sticky-bar fix"
          git push
